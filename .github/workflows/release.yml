name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-08
          components: rust-src
      - name: Download the WDK kernel libraries
        shell: pwsh
        run: |
          $version = '10.0.26100.6584'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$version/microsoft.windows.wdk.x64.$version.nupkg"
          Invoke-WebRequest $url -OutFile wdk.zip
          Expand-Archive wdk.zip -DestinationPath C:\wdk
      - name: Build the driver
        working-directory: ramon-km
        env:
          WDK_ROOT: C:\wdk\c
        run: cargo build --release
      - name: Build the client
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p ramon-client
      - name: Sign with a throwaway test certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=RamonTestCert' -CertStoreLocation Cert:\CurrentUser\My
          $sys = 'target\x86_64-pc-windows-msvc\release\ramon.sys'
          Copy-Item 'target\x86_64-pc-windows-msvc\release\ramon.dll' $sys -Force
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.DirectoryName -match '\\x64$' } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /s My /sha1 $cert.Thumbprint $sys
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          Export-Certificate -Cert $cert -FilePath ramon-test.cer -Type CERT | Out-Null
      - name: Package
        shell: pwsh
        run: |
          $stage = 'ramon-rs'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'target\x86_64-pc-windows-msvc\release\ramon.sys' $stage
          Copy-Item 'ramon-km\ramon.inf' $stage
          Copy-Item 'target\release\ramon-client.exe' $stage
          Copy-Item 'scripts' $stage -Recurse
          Copy-Item 'README.md', 'LICENSE-MIT', 'LICENSE-APACHE', 'ramon-test.cer' $stage
          New-Item -ItemType Directory -Force "$stage\docs" | Out-Null
          Copy-Item 'docs\verification.md' "$stage\docs"
          Compress-Archive "$stage\*" "ramon-rs-${{ github.ref_name }}.zip" -Force
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }} (test-signed example build)" `
              --notes "Test-signed example build - not for production. Import ramon-test.cer into Trusted Root and Trusted Publishers, enable testsigning, then run scripts\install.ps1. See docs/verification.md for what is verified and what is open."
          }
          gh release upload "${{ github.ref_name }}" "ramon-rs-${{ github.ref_name }}.zip" --clobber
