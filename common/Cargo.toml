[package]
name = "common"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hex = { version = "~0", default-features = false, features = ["alloc"], optional = true }
log = "~0"
sha2 = { version = "~0", default-features = false, optional = true }
serde = { version = "~1", default-features = false, features = ["derive", "alloc"], optional = true }
thiserror-no-std = { version = "~2", optional = true }
ariadne = { path = "../ariadne" }

[features]
# deserialization, hashing and YAML rules; the driver builds without it (no_global_oom_handling)
default = ["client"]
client = ["dep:hex", "dep:serde", "dep:sha2", "dep:thiserror-no-std"]
